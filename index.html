<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="icon" href="icon.png"><title>복싱: 챔피언 로드</title><style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1b2333;--muted:#5b6478;--line:#e3e6ee;--accent:#c8902a;--accent2:#1d2a55;--chip:#eef1f8}
@media (prefers-color-scheme:dark){:root{--bg:#0d1120;--card:#161c30;--ink:#e8ebf4;--muted:#9aa3b8;--line:#2a3352;--accent:#e2b04a;--accent2:#e8ebf4;--chip:#1f2742}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',sans-serif;line-height:1.75;font-size:16px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#141b38,#24305f);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .in{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.2px}
.brand img{width:36px;height:36px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav a{color:#d9def0;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600}
.nav a.on{background:#e2b04a;color:#1b1406}.nav a:hover{text-decoration:none;background:rgba(255,255,255,.12)}.nav a.on:hover{background:#e2b04a}
.lang{color:#d9def0;font-size:13px;border:1px solid rgba(255,255,255,.35);padding:4px 10px;border-radius:999px}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 48px;display:grid;grid-template-columns:220px 1fr;gap:24px}
.toc{position:sticky;top:76px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
.toc b{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;margin-bottom:6px}
.toc a{display:block;color:var(--ink);padding:3px 0;line-height:1.45}.toc a:hover{color:var(--accent)}
main{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 32px;min-width:0}
h1{font-size:26px;line-height:1.35;margin:0 0 6px;letter-spacing:-.4px}
.meta{color:var(--muted);font-size:13px;margin-bottom:18px}
h2{font-size:19px;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line);letter-spacing:-.2px}
h2:first-of-type{border-top:0;padding-top:0}
h3{font-size:16px;margin:22px 0 6px}
.faq h3{margin:14px 0 0;background:var(--chip);border-radius:10px 10px 0 0;padding:10px 14px}
.faq h3+p{margin:0 0 4px;background:var(--chip);border-radius:0 0 10px 10px;padding:4px 14px 12px}
p{margin:8px 0}ul{padding-left:20px;margin:8px 0}li{margin:3px 0}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--chip);text-align:left;font-weight:700}
td,th{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}tbody tr:nth-child(even) td{background:rgba(127,137,160,.06)}
foot,.foot{display:block;max-width:960px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px;text-align:center}
.hero{max-width:960px;margin:0 auto;padding:40px 20px 8px;text-align:center}
.hero img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hero h1{font-size:30px;margin:16px 0 6px}.hero p{color:var(--muted);margin:0 auto;max-width:560px}
.cards{max-width:960px;margin:24px auto 40px;padding:0 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media (max-width:560px){.cards{grid-template-columns:1fr}}
.cards a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;color:var(--ink)}
.cards a:hover{text-decoration:none;border-color:var(--accent);transform:translateY(-1px)}
.cards b{display:block;font-size:17px;margin-bottom:4px}.cards span{color:var(--muted);font-size:14px}
@media (max-width:760px){.wrap{grid-template-columns:1fr}.toc{position:static}main{padding:22px 18px}.nav{margin-left:0;width:100%}}
</style></head><body><header class="top"><div class="in"><a class="brand" href="index.html"><img src="icon.png" alt="">복싱: 챔피언 로드</a><nav class="nav"><a href="privacy.html" class="">개인정보처리방침</a><a href="terms.html" class="">이용약관</a><a href="support.html" class="">고객센터</a></nav><a class="lang" href="index.html">English</a></div></header><section class="hero"><img src="icon.png" alt=""><h1>복싱: 챔피언 로드</h1><p>84명의 복서를 영입하고 키워 아마추어 컵부터 챔피언스 리그까지 올라가는 복싱 육성 게임</p></section><div class="cards"><a href="privacy.html"><b>개인정보처리방침</b><span>수집하지 않는 정보와 기기 저장 방식</span></a><a href="terms.html"><b>이용약관</b><span>결제·환불·확률형 아이템 안내</span></a><a href="support.html"><b>고객센터</b><span>자주 묻는 질문 · 확률 정보 · 사업자 정보</span></a><a href="privacy_en.html"><b>English</b><span>Privacy · Terms · Support &amp; Odds</span></a></div><div class="foot">© 2026 복싱: 챔피언 로드 · <a href="support.html">문의</a></div></body></html>
